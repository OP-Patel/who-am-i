<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Arty A7 Optical DSP qualification results</title>
  <desc id="description">A technical cover showing the optical signal path, 0.03364 percent bit error rate, and 5.63 million qualified payload bits.</desc>
  <rect width="1600" height="1000" fill="#111210"/>
  <g stroke="#2b2e2a" stroke-width="2" opacity=".9">
