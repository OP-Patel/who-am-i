    <text x="82" y="218" fill="#faf9f5" font-size="78" font-weight="700" letter-spacing="-3">ARTY A7 OPTICAL DSP</text>
    <text x="85" y="274" fill="#9d9f98" font-size="25" letter-spacing="2">650 NM OOK  →  XADC  →  FIXED-POINT RX DSP  →  BER</text>
