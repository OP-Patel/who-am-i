    </g>
    <path d="M0 106h1370" stroke="#e7643a" stroke-width="9"/>
    <path d="m1315 70 55 36-55 36z" fill="#e7643a"/>
    <g fill="#e7643a">
      <circle cx="240" cy="106" r="13"/><circle cx="600" cy="106" r="13"/><circle cx="960" cy="106" r="13"/>
    </g>
  </g>
  <path d="M82 660h1436" stroke="#4a4d47" stroke-width="2"/>
  <g font-family="JetBrains Mono, monospace">
    <text x="82" y="760" fill="#faf9f5" font-size="78" font-weight="700">0.03364%</text>
    <text x="82" y="808" fill="#e7643a" font-size="24" font-weight="700" letter-spacing="4">MEASURED BER</text>
