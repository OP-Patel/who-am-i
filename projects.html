  <main>
    <section class="projects-hero section-shell">
      <div>
        <p class="eyebrow">Project archive</p>
        <h1>Things I’ve built.</h1>
      </div>
      <p>Ten projects across software, embedded systems, digital hardware, and electronics.</p>
    </section>

    <section class="project-browser section-shell">
      <div class="browser-controls">
        <label class="search-box">
          <span>Search projects</span>
          <input id="project-search" type="search" placeholder="Search by project or technology" autocomplete="off" />
        </label>
        <label class="sort-box">
          <span>Sort by</span>
          <select id="project-sort">
            <option value="impact">Featured</option>
            <option value="recent">Newest</option>
            <option value="name">Name</option>
          </select>
        </label>
      </div>
      <div class="filter-shell">
        <div class="filter-head">
          <span>Filter</span>
          <button class="text-button" id="clear-filters" type="button">Reset</button>
        </div>
        <div class="filter-chips" id="project-filters" aria-label="Project filters"></div>
      </div>
      <p class="result-count" id="result-count"></p>
      <div class="project-list" id="project-list" aria-live="polite"></div>
    </section>

  <footer class="site-footer">

    <div class="footer-socials">

  <div class="modal" id="project-modal" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-summary">

      </header>
      <div class="modal-body">
        <section class="gallery" aria-label="Project gallery">
          <button class="gallery-btn prev" id="slide-prev" type="button" aria-label="Previous image"><svg class="control-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="m15 18-6-6 6-6" /></svg></button>
          <div class="gallery-stage" id="modal-gallery"></div>
          <button class="gallery-btn next" id="slide-next" type="button" aria-label="Next image"><svg class="control-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none"><path d="m9 6 6 6-6 6" /></svg></button>
        </section>
        <aside class="modal-details">
          <div class="stat-row" id="modal-stats"></div>
          <h3>What I built</h3>
          <ul id="modal-details"></ul>
          <h3>Tools</h3>
          <div class="tag-row" id="modal-tags"></div>
          <div class="modal-links" id="modal-links"></div>
        </aside>
      </div>
    </div>
